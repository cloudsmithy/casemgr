[project]
name = "aws-case-manager"
version = "0.1.0"
description = "Cross-platform AWS Support Case management application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.80.0",
    "boto3>=1.34.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "moto>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
