name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/.flet/bin/flutter
          key: flutter-${{ runner.os }}-flet-0.80
          restore-keys: |
            flutter-${{ runner.os }}-
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-flet
      
      - name: Install Flet
        run: pip install flet>=0.80.0
      
      - name: Build APK
        run: |
          cd src
          flet build apk \
            --project aws-case-manager \
            --org com.aws.casemanager \
            --product "AWS Case Manager" \
            --yes
        env:
          FLET_FLUTTER_AUTO_INSTALL: "true"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aws-case-manager-apk
          path: src/build/apk/*.apk
          retention-days: 30
