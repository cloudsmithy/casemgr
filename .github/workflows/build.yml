name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Install Flet
        run: pip install flet
      
      - name: Build APK
        run: |
          flet build apk src/main.py \
            --project aws-case-manager \
            --org com.aws.casemanager \
            --product "AWS Case Manager"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aws-case-manager-apk
          path: build/apk/*.apk
          retention-days: 30
